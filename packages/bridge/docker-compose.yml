# =============================================================================
# Docker Compose — keb bridge + Caddy reverse proxy
#
# Quick start:
#   1. cp .env.example .env   # fill in secrets
#   2. docker build -f packages/bridge/Dockerfile -t keb-bridge .
#   3. docker compose -f packages/bridge/docker-compose.yml up -d
#
# Caddy handles TLS (Let's Encrypt) automatically and strips the
# /keb/v1 path prefix so the bridge receives clean /api/* paths.
# Change the domain below to match your setup.
# =============================================================================

services:
  bridge:
    image: keb-bridge
    container_name: keb-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/kb:/root/.pi/agent/kb
    expose:
      - "9876"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:9876/api/healthcheck',function(r){var d='';r.on('data',function(c){d+=c});r.on('end',function(){var j=JSON.parse(d);process.exit(j.status==='ok'?0:1)})}).on('error',function(){process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - keb

  caddy:
    image: caddy:2-alpine
    container_name: keb-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - keb

  backup:
    build:
      context: .
      dockerfile: packages/bridge/backup.Dockerfile
    container_name: keb-backup
    restart: unless-stopped
    environment:
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_BACKUP_RETENTION_DAYS=${R2_BACKUP_RETENTION_DAYS:-30}
      - TZ=Asia/Bangkok
    volumes:
      - ./data/kb:/data:ro
    networks:
      - keb

volumes:
  caddy-data:
  caddy-config:

networks:
  keb:
    driver: bridge
