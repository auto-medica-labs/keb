<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chrome-kb</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-title">
      <span class="header-icon">🧠</span>
      <span class="header-label">KB</span>
      <span class="header-ws" id="header-ws">· default</span>
      <select id="workspace-select" class="workspace-dropdown" title="Switch workspace">
        <option value="default">default</option>
      </select>
    </div>
    <div class="header-status">
      <span id="ws-status-dot" class="status-dot status-disconnected" title="Disconnected"></span>
      <span id="ws-status-text" class="status-text">disconnected</span>
    </div>
  </header>

  <!-- Tab bar -->
  <nav id="tab-bar">
    <button id="tab-add" class="tab-btn active" data-tab="add">📥 Add URL</button>
    <button id="tab-query" class="tab-btn" data-tab="query">🔍 Query</button>
    <button id="tab-browse" class="tab-btn" data-tab="browse">📚 Browse</button>
  </nav>

  <!-- Add Tab -->
  <section id="panel-add" class="panel active">
    <div class="add-form">
      <label for="add-url-input">URL</label>
      <div class="input-row">
        <input
          type="url"
          id="add-url-input"
          placeholder="https://example.com/article"
          autofocus
        />
        <button id="add-btn" class="btn btn-primary" disabled>Fetch &amp; Add</button>
      </div>
    </div>
    <div id="add-progress" class="progress-area hidden">
      <div class="progress-header">
        <span class="progress-spinner"></span>
        <span id="add-progress-text">Compiling...</span>
      </div>
      <div id="add-stream" class="stream-log"></div>
    </div>
  </section>

  <!-- Query Tab -->
  <section id="panel-query" class="panel">
    <div class="query-form">
      <label for="query-input">Ask the knowledge base</label>
      <div class="input-row">
        <input
          type="text"
          id="query-input"
          placeholder="What is the architecture?"
        />
        <button id="query-btn" class="btn btn-primary" disabled>Ask</button>
      </div>
    </div>
    <div id="query-progress" class="progress-area hidden">
      <div class="progress-header">
        <span class="progress-spinner"></span>
        <span id="query-progress-text">Searching...</span>
      </div>
    </div>
    <div id="query-result" class="result-area"></div>
  </section>

  <!-- Browse Tab -->
  <section id="panel-browse" class="panel">
    <div id="browse-list" class="browse-list">
      <p class="empty-state">No documents yet. Add a URL to get started.</p>
    </div>
  </section>

  <!-- Footer -->
  <footer id="footer">
    <span id="footer-stats">📊 0 docs · 0 concepts</span>
    <span id="footer-agent-status"></span>
  </footer>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
